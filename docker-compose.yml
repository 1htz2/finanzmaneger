services:
  finanzmanager:
    build: .
    image: finanzmanager:1.0
    container_name: finanzmanager
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FM_DATA_DIR: /data
    ports:
      # Default: reachable from this computer only. For phone access in your
      # home network set FM_BIND=0.0.0.0 in .env (see README).
      - "${FM_BIND:-127.0.0.1}:${FM_PORT:-8000}:8000"
    volumes:
      - ./data:/data
